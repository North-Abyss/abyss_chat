abstract class MyTask extends DefaultTask {
    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @TaskAction
    def run() {
        println "Task running"
        // Try getting it via this.getExecOperations()
        this.getExecOperations().exec {
            commandLine 'echo', 'Hello from this.getExecOperations()'
        }
    }
}
task myTask(type: MyTask)
